<div class="mdl" id="mdl" role="dialog" aria-modal="true" aria-label="Video" hidden><button class="x" id="mx" aria-label="Yopish">✕</button><span class="cnt" id="mc" aria-live="polite"></span><button class="nv pv" id="mp" aria-label="Oldingi video"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><div class="box"><iframe id="mf" title="Video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div><button class="nv nx" id="mn" aria-label="Keyingi video"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button><a class="yt" id="my" target="_blank" rel="noopener">YouTube'da ochish</a></div>
<script>
(()=>{const m=document.getElementById("mdl"),f=document.getElementById("mf"),y=document.getElementById("my"),x=document.getElementById("mx"),c=document.getElementById("mc"),p=document.getElementById("mp"),n=document.getElementById("mn"),L=[...document.querySelectorAll("a.reel")];let i=0;
if(L.length<2)p.hidden=n.hidden=c.hidden=true;
const show=k=>{i=(k+L.length)%L.length;const a=L[i];f.title=a.querySelector("img").alt||"Video";f.src="https://www.youtube-nocookie.com/embed/"+a.dataset.id+"?autoplay=1&playsinline=1&rel=0&modestbranding=1";y.href=a.href;c.textContent=(i+1)+" / "+L.length};
const close=()=>{m.hidden=true;f.src="about:blank";document.documentElement.style.overflow="";L[i].focus()};
const open=a=>{show(L.indexOf(a));m.hidden=false;document.documentElement.style.overflow="hidden";x.focus()};
L.forEach(a=>a.addEventListener("click",e=>{if(e.metaKey||e.ctrlKey||e.shiftKey||e.button)return;e.preventDefault();open(a)}));
x.onclick=close;p.onclick=()=>show(i-1);n.onclick=()=>show(i+1);
m.addEventListener("click",e=>{if(e.target===m)close()});
addEventListener("keydown",e=>{if(m.hidden)return;if(e.key==="Escape")close();else if(e.key==="ArrowLeft"){e.preventDefault();show(i-1)}else if(e.key==="ArrowRight"){e.preventDefault();show(i+1)}});
})();
</script>
