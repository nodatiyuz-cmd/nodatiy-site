<div class="mdl" id="mdl" role="dialog" aria-modal="true" aria-label="Video" hidden><button class="x" id="mx" aria-label="Yopish">✕</button><div class="box"><iframe id="mf" title="Video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div><a class="yt" id="my" target="_blank" rel="noopener">YouTube'da ochish</a></div>
<script>
(()=>{const m=document.getElementById("mdl"),f=document.getElementById("mf"),y=document.getElementById("my"),x=document.getElementById("mx");let last=null;
const close=()=>{m.hidden=true;f.src="about:blank";document.documentElement.style.overflow="";if(last)last.focus()};
const open=a=>{last=a;f.src="https://www.youtube-nocookie.com/embed/"+a.dataset.id+"?autoplay=1&playsinline=1&rel=0&modestbranding=1";y.href=a.href;m.hidden=false;document.documentElement.style.overflow="hidden";x.focus()};
document.querySelectorAll("a.reel").forEach(a=>a.addEventListener("click",e=>{if(e.metaKey||e.ctrlKey||e.shiftKey||e.button)return;e.preventDefault();open(a)}));
x.onclick=close;m.addEventListener("click",e=>{if(e.target===m)close()});
addEventListener("keydown",e=>{if(e.key==="Escape"&&!m.hidden)close()});
})();
</script>
